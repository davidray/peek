[project]
name = "peek"
version = "0.1.0"
description = "Let an AI agent take a photo with your camera via MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "David Ray" },
]
urls = { Repository = "https://github.com/davidray/peek" }
dependencies = [
    "mcp[cli]>=2.2.0",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
peek = "peek.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peek"]
